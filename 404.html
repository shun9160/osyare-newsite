<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ページが見つかりません｜おしゃれ倶楽部</title>
<link rel="icon" type="image/png" href="/images/logo.png">
<style>
:root{--bg:#FAF9F7;--ink:#32200F;--muted:#8C7B6C;--line:#E4DCD3;--accent:#9A6A3E}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#16110D;--ink:#F0E6DA;--muted:#9A8878;--line:#3A2E24;--accent:#D6A675}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.8;text-align:center}
.logo{width:56px;height:56px;margin:0 auto 20px;background:var(--ink);-webkit-mask:url("/images/logo.png") center/contain no-repeat;mask:url("/images/logo.png") center/contain no-repeat}
h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:24px;margin:0 0 8px}
p{color:var(--muted);margin:0 0 24px}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
a{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:8px 18px}
a:first-child{background:var(--ink);color:var(--bg);border-color:var(--ink)}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true"></div>
  <h1>ページが見つかりません</h1>
  <p>サイトをリニューアルしたため、ページの場所が変わった可能性があります。</p>
  <nav><a href="/">トップへ</a><a href="/price/">料金</a><a href="/tenpo/">店舗情報</a><a href="/contact/">お問い合わせ</a></nav>
</main>
</body>
</html>
